# Static phext serving with stock nginx (no module): Phase 1 of phext-streaming-plan.md.
# Serves pre-built bundles (phext-bundle writes app.phext + app.phext.gz) with gzip_static, over HTTP/2
# and HTTP/1.1. Include inside `http { }`, or run standalone with servers/nginx/check.sh.
#
#   PHEXT_ROOT  the site directory (contains app.phext.gz, phext-sw.js, ...)

types {
    application/vnd.phext  phext;
}

server {
    listen 8443 ssl http2;          # nginx >= 1.25.1 prefers `listen 8443 ssl;` + `http2 on;`
    server_name localhost;
    ssl_certificate     PHEXT_CERT;
    ssl_certificate_key PHEXT_KEY;
    ssl_protocols TLSv1.3;

    root PHEXT_ROOT;

    gzip            on;
    gzip_types      application/vnd.phext text/css text/javascript application/javascript application/json;
    gzip_comp_level 6;
    gzip_static     on;             # app.phext -> app.phext.gz, sent as-is (no per-request compression)
    gzip_vary       on;

    location = /app.phext {
        add_header Cache-Control "no-cache";
        # Externals in the bundle header, so browsers fetch them in parallel with the bundle.
        # Generate from phext-bundle's app.links:
        #   sed 's/^/add_header Link "/; s/$/" always;/' app.links
        include PHEXT_LINKS;
    }

    location = /phext-sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }
}
