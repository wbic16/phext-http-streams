[package]
name = "phext-bundle"
description = "Builds gzip'd phext bundles from a directory using the spec's inline rule"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
phext-stream = { path = "../../core/phext-stream" }
flate2 = "1"
# alternative encoders: zopfli and libdeflate (gzip-compatible), brotli and zstd (Content-Encoding br / zstd)
zopfli = { version = "0.8", default-features = false, features = ["gzip", "std"] }
libdeflater = "1"
brotli = "8"
zstd = "0.13"
